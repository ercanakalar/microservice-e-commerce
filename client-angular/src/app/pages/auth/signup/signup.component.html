<div class="flex justify-center flex-wrap bg-auth-background bg-no-repeat bg-cover h-screen signIn-card">
  <div class="inline justify-center rounded-md container w-[32rem] m-4 bg-white">
    <form [formGroup]="authForm" (ngSubmit)="submitForm()" class="flex flex-col items-center gap-6 w-full">
      <div>
        <span class="flex justify-center text-4xl font-extrabold font-poppins p-6">
          Sign Up
        </span>
      </div>
      <div class="inline-grid gap-6 w-3/4">
        <div class="flex gap-2">
          <app-form-input inputId="firstName" type="text" placeHolder="First Name" labelName="First Name"
            icon="fas fa-user" (inputValue)="onChangeInput($event)">
          </app-form-input>
          <app-form-input inputId="lastName" type="text" placeHolder="Last Name" labelName="Last Name"
            icon="fas fa-user" (inputValue)="onChangeInput($event)">
          </app-form-input>
        </div>
        <app-form-input inputId="email" type="email" placeHolder="E-mail" labelName="E-mail" icon="fas fa-user"
          (inputValue)="onChangeInput($event)">
        </app-form-input>
        <app-form-input inputId="password" type="password" placeHolder="Password" labelName="Password"
          icon="fas fa-lock" (inputValue)="onChangeInput($event)"></app-form-input>
        <app-form-input inputId="confirmPassword" type="password" placeHolder="Confirm Password"
          labelName="Confirm Password" icon="fas fa-lock" (inputValue)="onChangeInput($event)"></app-form-input>
      </div>
      <div class="flex justify-end w-3/4 text-sm opacity-70">
        <a routerLink="/auth/forgot-password">Forgot Password?</a>
      </div>
      <div class="w-3/4">
        <div class="wrap-button">
          <div class="button-bg"></div>
          <app-submit-button class="w-3/4" title="Sign In"></app-submit-button>
        </div>
      </div>
    </form>
    <div class="flex flex-col justify-between relative top-[5%] h-[25%]">
      <div class="flex flex-col justify-center items-center gap-6">
        <span>Or Sign In Using</span>
        <a class="flex h-12 w-12 items-center justify-center rounded-full font-poppins font-bold bg-red-500 text-white"
          routerLink="/auth/google">
          <i class="fa-brands fa-google" style="color: #ffffff"></i>
        </a>
      </div>
      <div class="flex flex-col justify-center items-center gap-6">
        <span>Or Sign In Using</span>
        <a class="flex h-full w-full items-center justify-center font-semibold hover:text-indigo-600"
          routerLink="/auth/signin">
          SIGN In
        </a>
      </div>
    </div>
  </div>
</div>
